events {}

http {
  # ngrok (o cualquier proxy delante) termina TLS y avisa por X-Forwarded-Proto.
  # Si nginx lo pisa con $scheme (siempre "http"), las apps generan URLs http://
  # y el navegador las bloquea por mixed content al entrar por https.
  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~^https?$" $http_x_forwarded_proto;
  }

  # Connection: upgrade solo cuando el cliente pide websocket
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream airflow_upstream {
    server airflow-webserver:8080;
  }

  upstream mlflow_upstream {
    server mlflow:5000;
  }

  upstream streamlit_upstream {
    server streamlit:8501;
  }

  upstream minio_upstream {
    server minio:9001;
  }

  upstream api_upstream {
    server api:8000;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 100m;
    # Airflow manda cookies grandes; con los buffers por defecto da 502
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;

    # sin estos, entrar a /airflow (sin barra) no matchea location /airflow/
    # y cae en el location / -> Streamlit
    location = /airflow { return 301 /airflow/; }
    location = /mlflow  { return 301 /mlflow/;  }
    location = /minio   { return 301 /minio/;   }
    location = /api     { return 301 /api/;     }

    # OJO con la barra final de proxy_pass: SIN barra, nginx reenvia la URI
    # completa y la app recibe /airflow/... CON barra, nginx corta el prefijo y
    # la app cree que vive en la raiz, devolviendo HTML con links absolutos a
    # /static/... que terminan cayendo en el location / (Streamlit).
    # Airflow necesita el prefijo (sin barra); MinIO no (ver abajo). A los dos
    # hay que decirles cual es su URL publica igual: AIRFLOW__WEBSERVER__BASE_URL
    # y MINIO_BROWSER_REDIRECT_URL en docker-compose.yml.
    location /airflow/ {
      proxy_pass http://airflow_upstream;
    }

    # OJO: aca la barra final SI va. La consola de MinIO devuelve su HTML con
    # <base href="/minio/"> (se lo dicta MINIO_BROWSER_REDIRECT_URL), o sea le
    # pide al navegador que prefije todo con /minio/, pero despues sirve los
    # assets solo en la raiz: /minio/static/js/... cae en el catch-all del SPA y
    # devuelve el index.html en vez del bundle. Con la barra, nginx recorta el
    # prefijo y MinIO recibe /static/js/... , que es donde realmente vive.
    location /minio/ {
      proxy_pass http://minio_upstream/;
    }

    # MLflow sirve sus assets con rutas relativas, asi que funciona con el
    # prefijo recortado y no necesita configuracion extra.
    location /mlflow/ {
      proxy_pass http://mlflow_upstream/;
    }

    # La API recibe el prefijo recortado; FastAPI lo reconstruye para Swagger
    # con root_path="/api" (ver api/main.py).
    location /api/ {
      proxy_pass http://api_upstream/;
    }

    location / {
      proxy_pass http://streamlit_upstream/;
      proxy_read_timeout 86400;
    }
  }
}
